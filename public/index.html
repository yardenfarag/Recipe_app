<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="robots" content="noindex" />
    <script>
      // The app lives under /app. Old links (/s/…, /auth-callback, /reset-password…) land on
      // GitHub Pages' 404.html, which is this shell — move them under /app, keeping query and hash.
      (function () {
        var path = window.location.pathname;
        if (path !== '/app' && path.indexOf('/app/') !== 0) {
          window.location.replace('/app' + path + window.location.search + window.location.hash);
        }
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style>
      /* Boot shell: paints right away while the app bundle downloads. React replaces it
         on first render. Colors match the default theme (src/constants/themes.ts). */
      body {
        margin: 0;
        background: #f4f1f8;
      }
      .boot {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif;
        letter-spacing: -0.02em;
        color: #7b6b9a;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #12101a;
        }
        .boot {
          color: #b8a8d4;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"><div class="boot" aria-hidden="true">Pinch</div></div>
  </body>
</html>
