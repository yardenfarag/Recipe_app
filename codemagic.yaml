# Codemagic CI for Pinch (Expo managed → iOS TestFlight)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/
#
# Before first build in Codemagic UI:
# 1. Teams → Integrations → App Store Connect API key (name it exactly: pinch_asc)
# 2. Enable automatic iOS code signing for bundle id com.pinch.myapp
# 3. Environment group "pinch_secrets" with EXPO_PUBLIC_* vars (see .env.example)
# 4. Set APP_STORE_APPLE_ID below to your numeric Apple ID from
#    App Store Connect → App → App Information → Apple ID
# 5. Commit this file, push, then "Check for configuration file"

workflows:
  ios-testflight:
    name: Pinch iOS → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: pinch_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pinch.myapp
      groups:
        - pinch_secrets
      node: 22.15.0
      vars:
        BUNDLE_ID: com.pinch.myapp
        # After expo prebuild, Xcode project name matches app.json "name"
        XCODE_WORKSPACE: Pinch.xcworkspace
        XCODE_SCHEME: Pinch
        # REPLACE with App Store Connect numeric Apple ID (not the bundle id)
        APP_STORE_APPLE_ID: "6796310453"
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Expo prebuild (generate ios/)
        script: |
          npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing profiles
        script: |
          xcode-project use-profiles
      - name: Increment iOS build number
        script: |
          cd "$CM_BUILD_DIR/ios"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || true)
          if [ -z "$LATEST_BUILD_NUMBER" ] || [ "$LATEST_BUILD_NUMBER" = "null" ]; then
            LATEST_BUILD_NUMBER=0
          fi
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - yarden.farag@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Upload to TestFlight; first external group needs beta review once
        submit_to_testflight: true
        # Uncomment and match exact TestFlight group names in ASC when ready:
        # beta_groups:
        #   - Internal Testers
