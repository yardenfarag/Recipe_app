name: Deploy backend

# The only way migrations and Edge Functions reach production (PIN-36). There is no staging
# environment: test locally or with a preview function first (supabase/README.md, "Testing backend changes").
on:
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/backend-tests.yml'
      - 'scripts/backend-changes.mjs'
  # Tests and deploys everything, whatever changed.
  workflow_dispatch:

# Deploys queue behind each other; a running deploy is never cancelled halfway.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ccobefeofhnncpgifxel
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  # What changed since the last successful deploy, so tests and function deploys cover only that
  # (scripts/backend-changes.mjs). Comparing with the last success, not the previous push, also picks up
  # anything a failed or cancelled deploy left out.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      db-tests: ${{ steps.plan.outputs.db-tests }}
      function-tests: ${{ steps.plan.outputs.function-tests }}
      all-functions: ${{ steps.plan.outputs.all-functions }}
      functions: ${{ steps.plan.outputs.functions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Plan the deploy
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          base=""
          if [ "$EVENT" != workflow_dispatch ]; then
            base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-backend.yml --branch master               --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          fi
          if [ -n "$base" ] && git merge-base --is-ancestor "$base" HEAD; then
            echo "Last successful deploy: $base"
            git diff --name-only "$base" HEAD > changed.txt
            node scripts/backend-changes.mjs changed.txt
          else
            node scripts/backend-changes.mjs
          fi

  tests:
    needs: changes
    uses: ./.github/workflows/backend-tests.yml
    with:
      skip-db: ${{ needs.changes.outputs.db-tests != 'true' }}
      skip-functions: ${{ needs.changes.outputs.function-tests != 'true' }}

  deploy:
    needs: [changes, tests]
    # Runs when tests passed or none were needed, never after a failure.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      # No database password: with only the access token the CLI connects through a temporary login role.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # db push re-runs any local migration missing from the remote history, even one older than what's
      # live, and a re-run can silently revert functions that later migrations redefined. Only new
      # migrations (newer than the latest applied one) may go out.
      - name: Check migration history
        id: migrations
        run: |
          supabase migration list --linked --output-format json > migrations.json
          remote_only=$(jq -r '.migrations[] | select((.local // "") == "") | .remote' migrations.json)
          latest=$(jq '[.migrations[] | select((.remote // "") != "") | .remote | tonumber] | max' migrations.json)
          pending=$(jq -r '.migrations[] | select((.remote // "") == "") | .local' migrations.json)
          stale=$(jq -r --argjson latest "$latest" \
            '.migrations[] | select((.remote // "") == "") | .local | select(tonumber < $latest)' migrations.json)
          if [ -n "$remote_only" ]; then
            echo "::error::Production has migrations that are not in the repo: $remote_only. Add the files (or repair the history) before deploying."
            exit 1
          fi
          if [ -n "$stale" ]; then
            echo "::error::These migrations are older than the latest applied one, so push would re-run them out of order: $stale. Give them a newer timestamp, or mark them applied with 'supabase migration repair' if they are already live."
            exit 1
          fi
          if [ -n "$pending" ]; then
            echo "New migrations: $pending"
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new migrations."
          fi

      # Migrations go first, so new functions never run against an old schema. Keep migrations
      # backward compatible (expand, then contract) so the functions still live keep working too.
      - name: Push migrations
        if: steps.migrations.outputs.pending == 'true'
        run: supabase db push --linked --yes

      # Deploys the functions that changed since the last successful deploy, or all of them when shared code
      # changed, so production always matches the repo. Never add --prune: it would delete the -preview copies
      # a developer deployed to test a branch (deploy-function-preview.yml), which aren't in the repo under that name.
      - name: Deploy Edge Functions
        if: needs.changes.outputs.functions != ''
        env:
          ALL: ${{ needs.changes.outputs.all-functions }}
          FUNCTIONS: ${{ needs.changes.outputs.functions }}
        run: |
          if [ "$ALL" = true ]; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
          else
            # shellcheck disable=SC2086 # one argument per name
            supabase functions deploy $FUNCTIONS --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
          fi

      - name: Smoke-check that the deployed functions boot
        if: needs.changes.outputs.functions != ''
        env:
          FUNCTIONS: ${{ needs.changes.outputs.functions }}
        run: |
          failed=""
          for fn in $FUNCTIONS; do
            for attempt in 1 2 3; do
              status=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
                "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/$fn" || echo 000)
              [ "$status" -lt 500 ] && [ "$status" != 000 ] && break
              sleep 5
            done
            echo "$fn: $status"
            if [ "$status" -ge 500 ] || [ "$status" = 000 ]; then failed="$failed $fn"; fi
          done
          if [ -n "$failed" ]; then
            echo "::error::These functions don't boot after deploy:$failed"
            exit 1
          fi
