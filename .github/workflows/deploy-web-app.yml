name: Deploy new web app

# The Next.js app in web/ on Cloudflare Workers (ADR 027). Live at next.pinch-app.io/app while we build it.
on:
  push:
    branches: [master, main]
    paths:
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/deploy-web-app.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-app
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/npm-shrinkwrap.json

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* values are baked into the browser bundle at build time.
      - name: Build the Worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          NEXT_PUBLIC_CREDIT_PURCHASES_ENABLED: ${{ vars.EXPO_PUBLIC_CREDIT_PURCHASES_ENABLED }}
        run: npm run build:worker

      - name: Deploy to Cloudflare (next.pinch-app.io)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      # A first deploy creates the DNS record and certificate, which can take a few minutes.
      - name: Check the app is live
        working-directory: .
        run: |
          for i in $(seq 1 18); do
            if curl -fsS -o /dev/null https://next.pinch-app.io/app; then echo "Live."; exit 0; fi
            sleep 10
          done
          echo "next.pinch-app.io/app did not serve the page"; exit 1
