name: Deploy new web app

# The Next.js app in web/ on Cloudflare Workers (ADR 027). Serves pinch-app.io/app since the switch (PIN-147),
# and next.pinch-app.io/app until the Expo web app is removed (PIN-148). Switching back: docs/WEB-APP-SWITCH.md.
on:
  push:
    branches: [master, main]
    paths:
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/deploy-web-app.yml'
      - 'scripts/check-web-routing.mjs'
  workflow_dispatch:

concurrency:
  group: deploy-web-app
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      skip-browser-tests: true
      skip-app-checks: true

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/npm-shrinkwrap.json

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* values are baked into the browser bundle at build time.
      - name: Build the Worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          # The same switch as the Expo web app (deploy-web.yml), so web sales have one on/off since the switch
          # (PIN-147). Anything but "true" hides Buy. PR previews keep it off (web-preview.yml).
          NEXT_PUBLIC_CREDIT_PURCHASES_ENABLED: ${{ vars.EXPO_PUBLIC_CREDIT_PURCHASES_ENABLED }}
        run: npm run build:worker

      - name: Deploy to Cloudflare (pinch-app.io/app and next.pinch-app.io)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      # Every kind of address on pinch-app.io goes to the right place: /app to this app, the rest to GitHub Pages
      # and the share Worker (ADR 027). Retries while a route change spreads across Cloudflare. Without the /app
      # routes in wrangler.jsonc (switched back, docs/WEB-APP-SWITCH.md), /app must be the Expo web app instead.
      - name: Check pinch-app.io routing
        working-directory: .
        run: |
          expect=expo
          if grep -q '"pinch-app.io/app/\*"' web/wrangler.jsonc; then expect=next; fi
          for i in $(seq 1 12); do
            if node scripts/check-web-routing.mjs --expect "$expect"; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Check next.pinch-app.io
        working-directory: .
        run: node scripts/check-web-routing.mjs --origin https://next.pinch-app.io --only-app
