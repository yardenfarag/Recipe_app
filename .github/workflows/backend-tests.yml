name: Backend tests

# Database (pgTAP) and Edge Function (Deno) tests (PIN-35). The DB tests hold
# the RLS, storage and grant regressions from the PIN-54 security audit.
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:
  # Deploy backend runs these before every production deploy, only the half its changes need.
  workflow_call:
    inputs:
      skip-db:
        type: boolean
        default: false
      skip-functions:
        type: boolean
        default: false

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    # Empty on pull_request and workflow_dispatch, so it always runs there.
    if: ${{ !inputs.skip-db }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Storage, auth and REST stay up: the tests use storage.objects and auth.users.
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,inbucket,realtime,edge-runtime,logflare,vector,supavisor

      # The app and the functions share these types (PIN-32). A migration change without `npm run db:types` fails here.
      - name: Generated types match the migrations
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          if ! diff -u supabase/functions/_shared/core/database.types.ts /tmp/database.types.ts; then
            echo "::error::supabase/functions/_shared/core/database.types.ts is out of date. Run 'npm run db:types' with local Supabase started and commit the result."
            exit 1
          fi

      - name: Database tests
        run: supabase test db

  functions:
    if: ${{ !inputs.skip-functions }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: deno check --no-lock --config supabase/functions/deno.json $(find supabase/functions -name '*.ts')

      - name: Edge Function tests
        # --config keeps Deno off the repo-root package.json, which would make it look for npm types in a node_modules CI never installs.
        run: deno test -A --no-lock --config supabase/functions/deno.json supabase/functions/
