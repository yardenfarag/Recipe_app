name: Web app preview

# A preview link for every PR that changes the new web app (ADR 027, ADR 030). It uploads a version
# of the pinch-web Worker with the alias pr-<number>, without deploying it, so next.pinch-app.io
# keeps serving master. The link is https://pr-<number>-pinch-web.<account>.workers.dev/app.
#
# A preview runs on production data, like the real app. Buying credits is off.
on:
  pull_request:
    paths:
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/web-preview.yml'

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Secrets aren't available to PRs from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/npm-shrinkwrap.json

      - run: npm ci

      - name: Build the Worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          # Never on a preview: anyone with the link could pay through code that isn't reviewed yet.
          NEXT_PUBLIC_CREDIT_PURCHASES_ENABLED: 'false'
        run: npm run build:worker

      - name: Upload a preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ github.event.pull_request.number }}
          MESSAGE: PR ${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}
        run: |
          npx opennextjs-cloudflare upload --preview-alias "$ALIAS" --message "$MESSAGE" 2>&1 | tee upload.log
          url=$(grep -oE "https://$ALIAS-pinch-web\.[a-z0-9-]+\.workers\.dev" upload.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::The upload didn't print a preview link for $ALIAS."
            exit 1
          fi
          echo "url=$url/app" >> "$GITHUB_OUTPUT"

      - name: Link the preview on the PR
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- web-preview -->';
            const body = [
              marker,
              `**Web app preview:** ${process.env.URL}`,
              '',
              `Built from ${process.env.SHA.slice(0, 7)}. It uses production data, so treat it as live. Buying credits is off.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
