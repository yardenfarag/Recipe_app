# Build iOS production IPA on EAS when you push (or run manually).
# Same EAS cloud queue as `eas build` locally — GitHub just starts it for you.
#
# Requires the same GitHub secret as Android:
#   EXPO_TOKEN = token from https://expo.dev/accounts/yardenfa/settings/access-tokens
#
# iOS credentials (distribution cert + profiles for app + share-extension) must
# already exist on the Expo project (set up by your first interactive build).
# EAS env vars (Supabase URL/key, legal URLs) must already exist on the Expo project.

name: EAS Build iOS (production)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'assets/**'
      - 'supabase/functions/**'
      - '.github/workflows/eas-build-ios.yml'

concurrency:
  group: eas-ios-production
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production IPA
        run: eas build --platform ios --profile production --non-interactive
