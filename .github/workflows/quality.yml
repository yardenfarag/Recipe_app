name: Quality

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      # Deploys and releases pass true: the browser tests already passed on the PR, and they take
      # longer than everything else here put together.
      skip-browser-tests:
        type: boolean
        default: false
      # A deploy checks only the app it ships: the Expo app and Workers (checks) or the Next.js app (web).
      # Every PR still runs both.
      skip-app-checks:
        type: boolean
        default: false
      skip-web-checks:
        type: boolean
        default: false

jobs:
  # On a pull request, which jobs its files need (scripts/pr-checks.mjs). Deploys and manual runs skip this
  # and run what their inputs ask for. If this job fails, every check runs.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # No permissions block: a deploy calls this workflow with a read-only token, and asking for more here
    # (pull-requests: read) stops every deploy from starting, even though this job only runs on PRs.
    outputs:
      app: ${{ steps.plan.outputs.app }}
      web: ${{ steps.plan.outputs.web }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The PR's merge commit and its first parent, the base branch.
          fetch-depth: 2
          sparse-checkout: scripts/pr-checks.mjs
          sparse-checkout-cone-mode: false

      - name: Pick the checks
        id: plan
        run: |
          git diff --name-only HEAD^1 HEAD > changed.txt
          node scripts/pr-checks.mjs changed.txt

  checks:
    needs: changes
    # The skip inputs are empty on pull_request and workflow_dispatch.
    if: ${{ !cancelled() && !inputs.skip-app-checks && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Export Expo web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_KEY: ci-placeholder
          EXPO_PUBLIC_LEGAL_BASE_URL: https://example.com
          EXPO_PUBLIC_SUPPORT_EMAIL: support@example.com
          EXPO_PUBLIC_CREDIT_PURCHASES_ENABLED: 'false'
        run: npm run export:web

  # The new Next.js web app (ADR 026, ADR 027). Own package.json and lockfile in web/.
  web:
    needs: changes
    if: ${{ !cancelled() && !inputs.skip-web-checks && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/npm-shrinkwrap.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build the Worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_KEY: ci-placeholder
          NEXT_PUBLIC_CREDIT_PURCHASES_ENABLED: 'false'
        run: npm run build:worker

  # Browser tests for the new web app, against local Supabase in this job (never production). ADR 026.
  # They run one at a time (web/playwright.config.ts), so they are split across machines instead, each
  # with its own Supabase and server. Raise the shard count as the suite grows.
  web-e2e:
    needs: changes
    if: ${{ !cancelled() && !inputs.skip-browser-tests && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    name: web-e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/npm-shrinkwrap.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Auth, REST, the mail catcher (sign-in codes are sent through it) and Realtime (a household's list updates live
      # on the others' screens, ADR 034) stay up.
      - name: Start Supabase
        working-directory: .
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 7
