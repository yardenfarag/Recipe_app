name: Quality

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Export Expo web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_KEY: ci-placeholder
          EXPO_PUBLIC_LEGAL_BASE_URL: https://example.com
          EXPO_PUBLIC_SUPPORT_EMAIL: support@example.com
          EXPO_PUBLIC_CREDIT_PURCHASES_ENABLED: 'false'
          EXPO_PUBLIC_PADDLE_CLIENT_TOKEN: test_ci_placeholder
          EXPO_PUBLIC_PADDLE_ENVIRONMENT: sandbox
          EXPO_PUBLIC_PADDLE_PRICE_10: pri_ci_placeholder_10
          EXPO_PUBLIC_PADDLE_PRICE_30: pri_ci_placeholder_30
          EXPO_PUBLIC_PADDLE_PRICE_100: pri_ci_placeholder_100
        run: npm run export:web
