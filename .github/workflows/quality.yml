name: Quality

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Export Expo web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_KEY: ci-placeholder
          EXPO_PUBLIC_LEGAL_BASE_URL: https://example.com
          EXPO_PUBLIC_SUPPORT_EMAIL: support@example.com
          EXPO_PUBLIC_CREDIT_PURCHASES_ENABLED: 'false'
        run: npm run export:web

  # The new Next.js web app (ADR 026, ADR 027). Own package.json and lockfile in web/.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/npm-shrinkwrap.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build the Worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_KEY: ci-placeholder
          NEXT_PUBLIC_CREDIT_PURCHASES_ENABLED: 'false'
        run: npm run build:worker
