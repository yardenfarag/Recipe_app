name: Quality

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      # Deploys and releases pass true: the browser tests already passed on the PR, and they take
      # longer than everything else here put together.
      skip-browser-tests:
        type: boolean
        default: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Export Expo web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_KEY: ci-placeholder
          EXPO_PUBLIC_LEGAL_BASE_URL: https://example.com
          EXPO_PUBLIC_SUPPORT_EMAIL: support@example.com
          EXPO_PUBLIC_CREDIT_PURCHASES_ENABLED: 'false'
        run: npm run export:web

  # The new Next.js web app (ADR 026, ADR 027). Own package.json and lockfile in web/.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/npm-shrinkwrap.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build the Worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_KEY: ci-placeholder
          NEXT_PUBLIC_CREDIT_PURCHASES_ENABLED: 'false'
        run: npm run build:worker

  # Browser tests for the new web app, against local Supabase in this job (never production). ADR 026.
  # They run one at a time (web/playwright.config.ts), so they are split across machines instead, each
  # with its own Supabase and server. Raise the shard count as the suite grows.
  web-e2e:
    # Empty on pull_request and workflow_dispatch, so they always run there.
    if: ${{ !inputs.skip-browser-tests }}
    name: web-e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/npm-shrinkwrap.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Auth, REST and the mail catcher (sign-in codes are sent through it) stay up.
      - name: Start Supabase
        working-directory: .
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 7
