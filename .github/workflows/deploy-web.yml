name: Deploy web to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      skip-browser-tests: true

  build:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (landing page at /, Expo web app at /app)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_LEGAL_BASE_URL: ${{ vars.EXPO_PUBLIC_LEGAL_BASE_URL }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
          EXPO_PUBLIC_CREDIT_PURCHASES_ENABLED: ${{ vars.EXPO_PUBLIC_CREDIT_PURCHASES_ENABLED }}
        run: |
          export EXPO_PUBLIC_LEGAL_BASE_URL="${EXPO_PUBLIC_LEGAL_BASE_URL:-https://pinch-app.io}"
          export EXPO_PUBLIC_SUPPORT_EMAIL="${EXPO_PUBLIC_SUPPORT_EMAIL:-support@pinch-app.io}"
          npm run build:web

      - name: Check the landing page is real HTML, with the guides
        run: |
          grep -q '<h1[ >]' dist/index.html
          grep -q 'apps.apple.com' dist/index.html
          grep -q 'play.google.com' dist/index.html
          test -f dist/app/index.html
          test -f dist/404.html
          test -f dist/site.css
          test -f dist/support.js
          grep -q 'data-support' dist/index.html
          test -f dist/hero-recipe.webp
          test -f dist/badges/app-store-en.svg
          test -f dist/badges/google-play-en.png
          grep -q 'id="save-tiktok-recipes"' dist/index.html
          grep -q 'guides/save-tiktok-recipes/' dist/llms.txt
          if grep -q '{{' dist/llms.txt; then echo 'llms.txt has an unfilled marker'; exit 1; fi

      # Compared with the live sitemap before this deploy replaces it. Sent after the deploy.
      - name: List pages that changed, for IndexNow
        id: indexnow
        continue-on-error: true
        run: echo "urls=$(node scripts/indexnow.mjs changed dist/sitemap.xml)" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tells Bing and the other IndexNow engines which pages changed. A failure here doesn't undo the deploy.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.indexnow_urls != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/indexnow.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Submit changed pages to IndexNow
        env:
          URLS: ${{ needs.build.outputs.indexnow_urls }}
        run: node scripts/indexnow.mjs submit "$URLS"
