name: Deploy web to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (landing page at /, Expo web app at /app)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_ADMIN_EMAILS: ${{ secrets.EXPO_PUBLIC_ADMIN_EMAILS }}
          EXPO_PUBLIC_LEGAL_BASE_URL: ${{ vars.EXPO_PUBLIC_LEGAL_BASE_URL }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
          EXPO_PUBLIC_CREDIT_PURCHASES_ENABLED: ${{ vars.EXPO_PUBLIC_CREDIT_PURCHASES_ENABLED }}
          EXPO_PUBLIC_REVENUECAT_WEB_API_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_WEB_API_KEY }}
          EXPO_PUBLIC_REVENUECAT_WEB_10_URL: ${{ vars.EXPO_PUBLIC_REVENUECAT_WEB_10_URL }}
          EXPO_PUBLIC_REVENUECAT_WEB_30_URL: ${{ vars.EXPO_PUBLIC_REVENUECAT_WEB_30_URL }}
          EXPO_PUBLIC_REVENUECAT_WEB_100_URL: ${{ vars.EXPO_PUBLIC_REVENUECAT_WEB_100_URL }}
        run: |
          export EXPO_PUBLIC_LEGAL_BASE_URL="${EXPO_PUBLIC_LEGAL_BASE_URL:-https://pinch-app.io}"
          export EXPO_PUBLIC_SUPPORT_EMAIL="${EXPO_PUBLIC_SUPPORT_EMAIL:-yarden.farag@gmail.com}"
          npm run build:web

      - name: Check the landing page is real HTML, with the guides
        run: |
          grep -q '<h1[ >]' dist/index.html
          grep -q 'apps.apple.com' dist/index.html
          test -f dist/app/index.html
          test -f dist/404.html
          test -f dist/site.css
          test -f dist/hero-recipe.webp
          grep -q 'id="save-tiktok-recipes"' dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
