# Edge Function notes — extract-recipe runs scrape + Gemini text + optional video.
# Per-function wall-clock timeout is not a supported config.toml key in current CLI;
# set longer limits in the Supabase Dashboard if extract hits the default cap.
# [functions.extract-recipe]
# verify_jwt = true

[functions.revenuecat-webhook]
verify_jwt = false

# Paddle signs its deliveries (Paddle-Signature); it sends no Supabase JWT.
[functions.paddle-webhook]
verify_jwt = false

# Polar signs its deliveries (Standard Webhooks headers); it sends no Supabase JWT.
[functions.polar-webhook]
verify_jwt = false

# Supabase Auth signs Send Email Hook calls with the hook secret; it sends no user JWT.
[functions.auth-email]
verify_jwt = false

# The welcome cron job sends a Vault secret (x-email-cron-secret), not a JWT.
[functions.welcome-emails]
verify_jwt = false

# The cron job sends its own secret, and the unsubscribe link in nudge emails is opened in a
# browser with no session.
[functions.nudges]
verify_jwt = false

# Unsubscribe links: mail apps' one-click POST and the /app/unsubscribe page carry a signed token, not a JWT.
[functions.email-preferences]
verify_jwt = false

# Households (ADR 034). The cron job sends its own secret (x-email-cron-secret), not a JWT.
[functions.household-activity]
verify_jwt = false

# "I'm going shopping": a signed-in member.
[functions.household-going-shopping]
verify_jwt = true

# The feedback trigger sends a Vault secret (x-support-email-secret), not a JWT.
[functions.support-email]
verify_jwt = false

[auth.email]
enable_confirmations = false
# Sign-in and password-reset codes are 6 digits and last an hour (the emails say so).
otp_length = 6
otp_expiry = 3600
